<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>今日开锅 · 每天九道家常菜</title>
<meta name="description" content="每天一份电炒锅就能完成的九道菜：三道荤菜、三道素菜、三道汤。" />
<meta name="theme-color" content="#f6f1e7" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23241f1b'/%3E%3Crect x='10' y='30' width='44' height='4' rx='2' fill='%23f6f1e7'/%3E%3C/svg%3E" />
<style>
  :root {
    --paper: #f6f1e7;
    --paper-2: #efe7d8;
    --ink: #241f1b;
    --ink-soft: #5d534a;
    --line: #d8cdb9;
    --meat: #b7472f;
    --veg: #506b49;
    --soup: #a87b32;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(36, 31, 27, .06), 0 10px 24px -16px rgba(36, 31, 27, .35);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 20px 64px;
    background:
      radial-gradient(1100px 520px at 12% -10%, #fffdf7 0%, rgba(255, 253, 247, 0) 60%),
      radial-gradient(900px 460px at 100% 0%, #f0e6d4 0%, rgba(240, 230, 212, 0) 55%),
      var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1120px; margin: 0 auto; }

  /* ---------- 顶部 ---------- */
  header.site {
    padding: 44px 0 26px;
    border-bottom: 1px solid var(--line);
  }

  .topline {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0;
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: .04em;
  }

  .brand .seal {
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--paper);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    transform: translateY(-4px);
  }

  .brand small {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .22em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .dateline {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .lede {
    max-width: 46em;
    margin: 18px 0 0;
    font-size: 15px;
    color: var(--ink-soft);
    text-wrap: pretty;
  }

  .lede strong { color: var(--ink); font-weight: 700; }

  /* ---------- 状态条 ---------- */
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding: 10px 14px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, .45);
    font-size: 13px;
    color: var(--ink-soft);
  }

  .status .dot {
    width: 7px; height: 7px;
    flex: none;
    border-radius: 50%;
    background: var(--veg);
  }

  .status[data-tone="wait"] { border-color: #d9b86a; background: rgba(255, 246, 224, .7); }
  .status[data-tone="wait"] .dot { background: #d9a93a; animation: pulse 1.6s ease-in-out infinite; }
  .status[data-tone="error"] { border-color: #d08a72; background: rgba(255, 236, 231, .7); }
  .status[data-tone="error"] .dot { background: #b7472f; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  /* ---------- 分区 ---------- */
  .board { display: grid; gap: 40px; margin-top: 40px; }

  section.cat { --accent: var(--meat); }

  .cat-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
  }

  .cat-head h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .08em;
  }

  .cat-head .en {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .cat-head .note {
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .reroll {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: .04em;
    cursor: pointer;
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }

  .reroll svg { transition: transform .35s ease; }

  .reroll:hover,
  .reroll:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    background: #fffdf8;
  }

  .reroll:hover svg { transform: rotate(180deg); }

  html.no-pool .reroll,
  html.no-pool .card-media .swap { display: none; }

  .swap-hint {
    display: none;
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .swap-hint.show { display: block; }

  .swap-hint b { color: var(--ink); font-weight: 700; }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin-top: 18px;
  }

  /* ---------- 卡片图区（16:9） ---------- */
  .card-media {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid hsl(var(--h) 24% 82% / .85);
    background:
      radial-gradient(115% 85% at 15% 6%, hsl(var(--h) 44% 85%) 0%, transparent 58%),
      radial-gradient(95% 80% at 88% 96%, hsl(var(--h) 34% 66% / .75) 0%, transparent 62%),
      linear-gradient(148deg, hsl(var(--h) 26% 94%) 0%, hsl(var(--h) 22% 86%) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55);
  }

  .card-media::before {
    content: attr(data-glyph);
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(44px, 6.4vw, 72px);
    font-weight: 800;
    letter-spacing: .08em;
    color: hsl(var(--h) 32% 24% / .17);
    transform: translateY(-3px);
    transition: transform .35s ease;
    pointer-events: none;
  }

  .card-media::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .18) 0 1px, transparent 1px 6px);
    mix-blend-mode: soft-light;
    pointer-events: none;
  }

  .card-media img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-media .media-frame {
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(36, 31, 27, .10);
    border-radius: 6px;
    pointer-events: none;
  }

  .card-media .swap {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid rgba(36, 31, 27, .14);
    border-radius: 50%;
    background: rgba(255, 253, 248, .86);
    color: var(--ink-soft);
    cursor: pointer;
    backdrop-filter: blur(2px);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity .18s ease, transform .18s ease, color .18s ease, border-color .18s ease;
  }

  article.card:hover .card-media .swap,
  .card-media .swap:focus-visible {
    opacity: 1;
    transform: none;
  }

  .card-media .swap:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .card-media .swap svg { transition: transform .4s ease; }
  .card-media .swap:hover svg { transform: rotate(150deg); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .card--enter { animation: cardIn .3s ease both; }

  article.card:hover .card-media::before { transform: translateY(-3px) scale(1.04); }

  /* ---------- 卡片 ---------- */
  article.card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px 18px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fffdf8;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  article.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 18px 34px -22px rgba(36, 31, 27, .5);
  }

  .card-index {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--accent);
  }

  .card-index::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--line), transparent);
  }

  .card h3 {
    margin: 0;
    font-size: 22px;
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: .02em;
  }

  .card .note {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .meta li {
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .meta li.hard { border-color: #d8b38a; color: #8a5a1f; }
  .meta li.mid  { border-color: #d9c489; color: #7d6420; }

  .ingredients {
    margin: 0;
    padding: 12px 0 0;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink);
  }

  .ingredients span.label {
    display: block;
    margin-bottom: 2px;
    font-size: 11px;
    letter-spacing: .16em;
    color: var(--ink-soft);
  }

  .video {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: background .16s ease, color .16s ease;
  }

  .video:hover,
  .video:focus-visible {
    background: var(--accent);
    color: #fffdf8;
  }

  .video svg { flex: none; }

  /* ---------- 最近 7 天 ---------- */
  .history { margin-top: 52px; --accent: var(--ink); }

  .history-list {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }

  .history-list li {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 18px;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }

  .h-date {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--ink);
  }

  .h-date small {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--ink-soft);
  }

  .h-items { display: grid; gap: 3px; }

  .h-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink-soft);
  }

  .h-line .hdot {
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    transform: translateY(-2px);
  }

  .h-line b { font-weight: 700; color: var(--ink); }

  /* ---------- 骨架屏 ---------- */
  .skeleton { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 18px; }

  .skeleton i {
    display: block;
    height: 210px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(100deg, #fffdf8 30%, #f2ebdd 50%, #fffdf8 70%);
    background-size: 220% 100%;
    animation: shimmer 1.5s linear infinite;
  }

  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  /* ---------- 底部 ---------- */
  footer.site {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink-soft);
    display: grid;
    gap: 6px;
  }

  footer.site code {
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--paper-2);
    font-size: 12px;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 900px) {
    .cards, .skeleton { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card-media .swap { opacity: 1; transform: none; }
  }

  @media (max-width: 620px) {
    body { padding: 0 14px 48px; }
    header.site { padding-top: 32px; }
    .cards, .skeleton { grid-template-columns: 1fr; }
    .cat-head { flex-wrap: wrap; }
    .cat-head .note { margin-left: 0; width: 100%; }
    .cat-head .reroll { margin-left: auto; }
    .card h3 { font-size: 20px; }
    .history-list li { grid-template-columns: 1fr; gap: 4px; }
    .h-date { display: flex; align-items: baseline; gap: 8px; }
    .h-date small { display: inline; }
    .h-line { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="topline">
      <h1 class="brand">
        <span class="seal">锅</span>
        今日开锅
        <small>Daily Wok</small>
      </h1>
      <div class="dateline" id="dateline">—</div>
    </div>
    <p class="lede">
      每天一份<strong>电炒锅就能做完</strong>的菜单：三道荤菜、三道素菜、三道汤，照着买、照着做。
    </p>
    <div class="status" id="status" data-tone="loading">
      <span class="dot"></span>
      <span id="status-text">正在读取今天的菜单…</span>
    </div>
    <div class="swap-hint" id="swap-hint"></div>
  </header>

  <main class="board" id="board" aria-live="polite">
    <div class="skeleton"><i></i><i></i><i></i></div>
  </main>

  <section class="history" id="history" hidden>
    <div class="cat-head">
      <h2>最近 7 天</h2>
      <span class="en">RECENT</span>
      <span class="note">前几天的菜单，按日期倒序</span>
    </div>
    <ol class="history-list" id="history-list"></ol>
  </section>

  <footer class="site">
    <div>菜单每天北京时间 00:05 自动生成，同一天内所有人看到的是同一份。</div>
    <div id="foot-meta">—</div>
    <div>视频入口优先指向固定教程，未配置时跳转 B 站搜索（关键词 = 菜名 + 电炒锅 + 教程）。</div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const DATA_URL = './data/today.json';
  const REFRESH_MS = 60 * 1000;           // 每分钟检查一次是否有新菜单
  const RETRY_MS = 60 * 1000;             // 菜单还没生成时的重试间隔

  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const dateline = document.getElementById('dateline');
  const footMeta = document.getElementById('foot-meta');

  const ACCENT = { meat: 'var(--meat)', veg: 'var(--veg)', soup: 'var(--soup)' };

  let lastGeneratedAt = null;
  let retryTimer = null;

  const POOL_URL = './data/dishes.json';
  const swapHint = document.getElementById('swap-hint');

  let pool = null;            // { meat: [dish], veg: [...], soup: [...] }
  let poolPromise = null;
  let cats = {};              // 分类元信息
  let shown = {};             // 当前显示的三道菜
  let recentIds = {};         // 最近 7 天用过的 id，换菜时避开
  let swapCount = 0;
  let currentDate = null;

  const beijingToday = () => new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());

  const weekday = (dateStr) => {
    const [y, m, d] = dateStr.split('-').map(Number);
    return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  };

  function setStatus(tone, text) {
    status.dataset.tone = tone;
    statusText.textContent = text;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (ch) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }

  function difficultyClass(level) {
    if (level === '稍难') return 'hard';
    if (level === '中等') return 'mid';
    return '';
  }

  // 分类基色 + id 抖动，保证同一分类色调统一、每道菜又略有差别
  const MEDIA_HUE = { meat: 14, veg: 96, soup: 36 };

  function hueOf(id, categoryKey) {
    const base = MEDIA_HUE[categoryKey] ?? 30;
    let h = 0;
    for (let i = 0; i < id.length; i += 1) h = (h * 31 + id.charCodeAt(i)) % 1000;
    return base + (h % 24) - 12;
  }

  function cardHtml(dish, index, cat) {
    const tags = dish.ingredients.map((item) => `<span>${escapeHtml(item)}</span>`).join(' · ');
    const glyph = (dish.name || '菜').slice(0, 1);
    const media = `<div class="card-media" style="--h:${hueOf(dish.id, cat && cat.key)}" data-glyph="${escapeHtml(glyph)}"><span class="media-frame"></span>${
      dish.imageUrl
        ? `<img src="${escapeHtml(dish.imageUrl)}" alt="${escapeHtml(dish.name)}" loading="lazy" decoding="async" onerror="this.remove()" />`
        : ''
    }<button class="swap" type="button" data-action="swap" data-cat="${cat.key}" data-idx="${index}" title="换一道${escapeHtml(cat.label)}" aria-label="换一道${escapeHtml(cat.label)}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9h-5.4"/>
        </svg>
      </button></div>`;
    return `
      <article class="card" data-cat="${cat.key}" data-idx="${index}">
        ${media}
        <div class="card-index">NO.0${index + 1}</div>
        <h3>${escapeHtml(dish.name)}</h3>
        <p class="note">${escapeHtml(dish.note || '')}</p>
        <ul class="meta">
          <li>${dish.minutes} 分钟</li>
          <li class="${difficultyClass(dish.difficulty)}">${escapeHtml(dish.difficulty)}</li>
        </ul>
        <p class="ingredients">
          <span class="label">主料</span>${tags}
        </p>
        <a class="video" href="${escapeHtml(dish.videoUrl)}" target="_blank" rel="noopener noreferrer">
          <span>${dish.videoSource === 'fixed' ? '看教学视频' : 'B 站搜索教程'}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M9 7h8v8" />
          </svg>
        </a>
      </article>`;
  }

  function renderRecent(recent, categories) {
    const section = document.getElementById('history');
    const list = document.getElementById('history-list');
    if (!section || !list) return;

    if (!Array.isArray(recent) || recent.length === 0) {
      section.hidden = true;
      return;
    }

    list.innerHTML = recent.map((day) => {
      const lines = categories.map((cat) => {
        const names = (day.items && day.items[cat.key]) || [];
        if (!names.length) return '';
        return `<div class="h-line">
          <i class="hdot" style="background:${cat.accent || ACCENT[cat.key] || 'var(--ink)'}"></i>
          <span><b>${escapeHtml(cat.label)}</b> ${names.map(escapeHtml).join('、')}</span>
        </div>`;
      }).join('');

      return `<li>
        <div class="h-date">${escapeHtml(day.date.slice(5).replace('-', '.'))}<small>${weekday(day.date)}</small></div>
        <div class="h-items">${lines}</div>
      </li>`;
    }).join('');

    section.hidden = false;
  }

  async function loadPool() {
    if (pool) return pool;
    if (!poolPromise) {
      poolPromise = fetch(`${POOL_URL}?v=${Date.now()}`, { cache: 'no-store' })
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((list) => {
          const grouped = {};
          list.forEach((dish) => {
            if (!grouped[dish.category]) grouped[dish.category] = [];
            grouped[dish.category].push(dish);
          });
          pool = grouped;
          return pool;
        })
        .catch((err) => {
          console.warn('[daily-wok] 候选菜库加载失败：', err);
          document.documentElement.classList.add('no-pool');
          return null;
        });
    }
    return poolPromise;
  }

  function pickReplacement(catKey) {
    const list = (pool && pool[catKey]) || [];
    const used = new Set((shown[catKey] || []).map((d) => d.id));
    const recent = recentIds[catKey] || new Set();
    let candidates = list.filter((d) => !used.has(d.id) && !recent.has(d.id));
    if (!candidates.length) candidates = list.filter((d) => !used.has(d.id));
    if (!candidates.length) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function replaceCardAt(catKey, index, dish) {
    const old = board.querySelector(`.card[data-cat="${catKey}"][data-idx="${index}"]`);
    if (!old) return;
    const holder = document.createElement('div');
    holder.innerHTML = cardHtml(dish, index, cats[catKey]).trim();
    const fresh = holder.firstElementChild;
    fresh.classList.add('card--enter');
    fresh.addEventListener('animationend', () => fresh.classList.remove('card--enter'), { once: true });
    old.replaceWith(fresh);
  }

  function updateHint(message) {
    if (!swapHint) return;
    if (message) {
      swapHint.innerHTML = escapeHtml(message);
      swapHint.classList.add('show');
      return;
    }
    if (swapCount > 0) {
      swapHint.innerHTML = `已临时替换 <b>${swapCount}</b> 道菜 · 只影响你这台设备，刷新页面恢复今日菜单`;
      swapHint.classList.add('show');
    } else {
      swapHint.innerHTML = '';
      swapHint.classList.remove('show');
    }
  }

  async function onSwap(catKey, index) {
    const ready = await loadPool();
    if (!ready) { updateHint('候选菜库没有加载成功，稍后再试'); return; }
    const dish = pickReplacement(catKey);
    if (!dish) { updateHint('这一类里暂时没有别的菜可以换了'); return; }
    shown[catKey][index] = dish;
    replaceCardAt(catKey, index, dish);
    swapCount += 1;
    updateHint();
  }

  async function onReroll(catKey) {
    const ready = await loadPool();
    if (!ready) { updateHint('候选菜库没有加载成功，稍后再试'); return; }
    let changed = 0;
    for (let i = 0; i < 3; i += 1) {
      const dish = pickReplacement(catKey);
      if (!dish) break;
      shown[catKey][i] = dish;
      replaceCardAt(catKey, i, dish);
      changed += 1;
    }
    if (!changed) { updateHint('这一类里暂时没有别的菜可以换了'); return; }
    swapCount += changed;
    updateHint();
  }

  function render(data) {
    cats = {};
    shown = {};
    recentIds = {};
    data.categories.forEach((cat) => {
      cats[cat.key] = cat;
      shown[cat.key] = cat.dishes.slice();
      recentIds[cat.key] = new Set((data.recentIds && data.recentIds[cat.key]) || []);
    });
    if (data.date !== currentDate) {
      currentDate = data.date;
      swapCount = 0;
      updateHint();
    }

    board.innerHTML = data.categories.map((cat) => `
      <section class="cat" style="--accent:${cat.accent || ACCENT[cat.key] || 'var(--ink)'}">
        <div class="cat-head">
          <h2>${escapeHtml(cat.label)}</h2>
          <span class="en">${escapeHtml(cat.en)}</span>
          <span class="note">${escapeHtml(cat.note)}</span>
          <button class="reroll" type="button" data-action="reroll" data-cat="${cat.key}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9h-5.4"/>
            </svg>
            换一换
          </button>
        </div>
        <div class="cards">${cat.dishes.map((dish, i) => cardHtml(dish, i, cat)).join('')}</div>
      </section>`).join('');

    dateline.textContent = `${data.date.replaceAll('-', '.')} ${weekday(data.date)}`;
    const time = new Date(data.generatedAt).toLocaleString('zh-CN', {
      timeZone: 'Asia/Shanghai', hour12: false,
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    });
    footMeta.textContent = `本菜单生成于 ${time} · 去重窗口 ${data.windowDays} 天 · 共 ${data.categories.reduce((n, c) => n + c.dishes.length, 0)} 道菜`;

    renderRecent(data.recent, data.categories);

    const today = beijingToday();
    if (data.date === today) {
      setStatus('ok', `今日菜单已就绪 · ${data.date} 北京时间`);
    } else {
      setStatus('wait', `正在等待今日（${today}）的菜单生成，页面会自动重试…`);
      scheduleRetry();
    }
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => load({ silent: true }), RETRY_MS);
  }

  async function load({ silent = false } = {}) {
    try {
      const res = await fetch(`${DATA_URL}?v=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const changed = data.generatedAt !== lastGeneratedAt || data.date !== dateline.dataset.date;
      if (!silent || changed) {
        render(data);
        lastGeneratedAt = data.generatedAt;
        dateline.dataset.date = data.date;
      }
    } catch (err) {
      if (!silent) {
        setStatus('error', '菜单读取失败，请稍后刷新页面重试。');
        board.innerHTML = `
          <section class="cat" style="--accent:var(--meat)">
            <div class="cat-head"><h2>暂时读不到菜单</h2></div>
            <p class="lede">如果刚部署完，通常等一两分钟即可；如果持续出现，请检查 <code>public/data/today.json</code> 是否已生成。</p>
          </section>`;
      }
      console.warn('[daily-wok] 读取今日菜单失败：', err);
      scheduleRetry();
    }
  }

  board.addEventListener('click', (event) => {
    const btn = event.target.closest('[data-action]');
    if (!btn) return;
    event.preventDefault();
    const catKey = btn.dataset.cat;
    if (btn.dataset.action === 'swap') onSwap(catKey, Number(btn.dataset.idx));
    else if (btn.dataset.action === 'reroll') onReroll(catKey);
  });

  load();
  setInterval(() => load({ silent: true }), REFRESH_MS);
})();
</script>
</body>
</html>
